name: macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy

      - name: Install locked dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.12.3 install --frozen-lockfile

      - name: Build unsigned macOS bundles
        shell: bash
        env:
          CI: true
        run: |
          corepack pnpm@10.12.3 tauri build \
            --target "${{ matrix.target }}" \
            --bundles app,dmg \
            --config src-tauri/tauri.unsigned.conf.json \
            --no-sign

      - name: Generate checksums
        shell: bash
        run: |
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -print0 \
            | xargs -0 shasum -a 256 > "checksums-${{ matrix.arch }}.txt"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v6
        with:
          name: cc2cx-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle
            checksums-${{ matrix.arch }}.txt

  publish:
    name: Publish macOS release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Download architecture bundles
        uses: actions/download-artifact@v6
        with:
          pattern: cc2cx-macos-*
          merge-multiple: true
          path: release-assets

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets/publish
          find release-assets -type f \( \
            -name '*.dmg' -o \
            -name 'checksums-*.txt' \
          \) -exec cp -f {} release-assets/publish/ \;
          cp -f artifacts/cc-launch_*.exe artifacts/cc-launch_*.msi release-assets/publish/
          cp -f artifacts/SHA256SUMS.txt release-assets/publish/checksums-windows.txt
          test -n "$(find release-assets/publish -type f -print -quit)"
          find release-assets/publish -maxdepth 1 -type f -print | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: cc2cx ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/publish/*.dmg
            release-assets/publish/*.exe
            release-assets/publish/*.msi
            release-assets/publish/checksums-*.txt
